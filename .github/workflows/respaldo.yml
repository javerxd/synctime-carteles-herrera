# Fase 16B (RNFP09): respaldo DIARIO de la base de Azure SQL, guardado FUERA del servidor principal (Blob Storage), con retencion de 30 dias.
#
# Esta fase (16B) solo ESCRIBE este archivo. No se ejecuta hasta la 16C, cuando existan Azure SQL, Blob Storage y los secretos.
#
# Como funciona: exporta la base completa como .bacpac (esquema y datos), comprueba que el archivo sea valido, lo sube al contenedor PRIVADO
# «respaldos» (sin acceso publico) y borra los de mas de 30 dias. La exportacion es de la base en uso: si alguien escribe mientras se
# exporta, el archivo puede no ser transaccionalmente consistente. Con el trafico de un taller es un riesgo aceptado y esta anotado en
# docs/despliegue.md; la 16C prueba una restauracion real en localhost\SQLEXPRESS.
# Defensa en profundidad: ademas de este borrado, la cuenta de almacenamiento debe tener una regla de ciclo de vida que borre a los 30 dias.
#
# Un workflow programado solo corre desde la rama por omision (main) y GitHub lo pausa si el repositorio queda 60 dias sin actividad.
# Si el respaldo falla, GitHub avisa por correo a quien lo programo por ultima vez.
#
# Secretos del entorno «azure-respaldo» (sin aprobacion: es automatico; los carga el usuario en la 16C):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (una identidad solo con: abrir/cerrar el cortafuegos del servidor SQL y
#   «Storage Blob Data Contributor» en esa cuenta), AZURE_SQL_RESPALDO_USUARIO, AZURE_SQL_RESPALDO_PASSWORD (un usuario que solo lee).
# Variables del entorno: AZURE_RESOURCE_GROUP, AZURE_SQL_SERVIDOR, AZURE_SQL_BASE, AZURE_STORAGE_ACCOUNT
name: Respaldo diario de la base de datos

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: respaldo-azure-sql
  cancel-in-progress: false

env:
  RETENCION_DIAS: "30"
  CONTENEDOR: respaldos
  # Con menos de este numero de respaldos, el borrado no elimina nada (si los respaldos fallaran, no se pierden los ultimos buenos).
  MINIMO_A_CONSERVAR: "7"

jobs:
  respaldar:
    name: Exportar, verificar, guardar y rotar
    # Solo desde main (los programados ya corren ahi); el entorno también debe limitar las ramas a main en GitHub.
    if: github.ref == 'refs/heads/main'
    environment: azure-respaldo
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    env:
      GRUPO: ${{ vars.AZURE_RESOURCE_GROUP }}
      SERVIDOR: ${{ vars.AZURE_SQL_SERVIDOR }}
      BASE: ${{ vars.AZURE_SQL_BASE }}
      CUENTA_BLOB: ${{ vars.AZURE_STORAGE_ACCOUNT }}
    # Los secretos (usuario y clave de SQL) NO van en el env de todo el job: solo en los pasos que los usan.
    steps:
      - name: Comprobar la configuración
        env:
          SQL_USUARIO: ${{ secrets.AZURE_SQL_RESPALDO_USUARIO }}
          SQL_PASSWORD: ${{ secrets.AZURE_SQL_RESPALDO_PASSWORD }}
        run: |
          for variable in GRUPO SERVIDOR BASE CUENTA_BLOB SQL_USUARIO SQL_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::Falta configurar ${variable} en el entorno azure-respaldo."
              exit 1
            fi
          done
      - name: Instalar el SDK de .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Instalar sqlpackage (versión fija; antes de iniciar sesión, para que no vea credenciales)
        run: |
          dotnet tool install --global microsoft.sqlpackage --version 170.5.96
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Iniciar sesión en Azure (OIDC, sin contraseña guardada)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Abrir el cortafuegos de Azure SQL solo para esta máquina
        run: |
          ip="$(curl --fail --silent --show-error --max-time 10 --retry 3 https://api.ipify.org)"
          if ! [[ "$ip" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]; then
            echo "::error::No se pudo conocer la IP de esta máquina."
            exit 1
          fi
          az sql server firewall-rule create --resource-group "$GRUPO" --server "$SERVIDOR" \
            --name "respaldo-${GITHUB_RUN_ID}" --start-ip-address "$ip" --end-ip-address "$ip" --output none
      - name: Exportar la base a un archivo .bacpac
        env:
          SQL_USUARIO: ${{ secrets.AZURE_SQL_RESPALDO_USUARIO }}
          SQL_PASSWORD: ${{ secrets.AZURE_SQL_RESPALDO_PASSWORD }}
        run: |
          echo "::add-mask::${SQL_PASSWORD}"
          sqlpackage /Action:Export /SourceServerName:"tcp:${SERVIDOR}.database.windows.net,1433" /SourceDatabaseName:"$BASE" \
            /SourceUser:"$SQL_USUARIO" /SourcePassword:"$SQL_PASSWORD" /SourceEncryptConnection:True /SourceTrustServerCertificate:False \
            /SourceTimeout:120 /TargetFile:"$RUNNER_TEMP/respaldo.bacpac" /Quiet:True
      - name: Verificar el respaldo (archivo válido y con contenido)
        run: |
          tamano="$(stat -c %s "$RUNNER_TEMP/respaldo.bacpac")"
          if [ "$tamano" -lt 2048 ]; then
            echo "::error::El respaldo pesa ${tamano} bytes: es demasiado pequeño para ser real. No se sube ni se rota nada."
            exit 1
          fi
          python3 -c "import sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); assert z.testzip() is None; assert any(n.lower()=='model.xml' for n in z.namelist()), 'sin Model.xml'" "$RUNNER_TEMP/respaldo.bacpac"
          echo "Respaldo válido: ${tamano} bytes."
      - name: Subir el respaldo a Blob Storage (contenedor privado)
        run: |
          nombre="diario/synctime-$(date -u +%Y-%m-%dT%H%MZ).bacpac"
          az storage blob upload --auth-mode login --account-name "$CUENTA_BLOB" --container-name "$CONTENEDOR" \
            --name "$nombre" --file "$RUNNER_TEMP/respaldo.bacpac" --overwrite false --output none
          local_bytes="$(stat -c %s "$RUNNER_TEMP/respaldo.bacpac")"
          remoto_bytes="$(az storage blob show --auth-mode login --account-name "$CUENTA_BLOB" --container-name "$CONTENEDOR" --name "$nombre" --query properties.contentLength --output tsv)"
          if [ "$local_bytes" != "$remoto_bytes" ]; then
            echo "::error::El respaldo subido (${remoto_bytes} bytes) no coincide con el exportado (${local_bytes} bytes)."
            exit 1
          fi
          echo "- Respaldo guardado: \`${CONTENEDOR}/${nombre}\` (${remoto_bytes} bytes)" >> "$GITHUB_STEP_SUMMARY"
      - name: Borrar respaldos de mas de 30 dias (nunca bajar del mínimo a conservar)
        run: |
          limite="$(date -u -d "${RETENCION_DIAS} days ago" +%Y-%m-%d)"
          mapfile -t existentes < <(az storage blob list --auth-mode login --account-name "$CUENTA_BLOB" --container-name "$CONTENEDOR" --prefix diario/ --query "[].name" --output tsv)
          total="${#existentes[@]}"
          borrados=0
          for nombre in "${existentes[@]}"; do
            if [[ "$nombre" =~ ^diario/synctime-([0-9]{4}-[0-9]{2}-[0-9]{2})T[0-9]{4}Z\.bacpac$ ]]; then
              fecha="${BASH_REMATCH[1]}"
              if [[ "$fecha" < "$limite" ]] && [ $((total - borrados)) -gt "$MINIMO_A_CONSERVAR" ]; then
                az storage blob delete --auth-mode login --account-name "$CUENTA_BLOB" --container-name "$CONTENEDOR" --name "$nombre" --output none
                borrados=$((borrados + 1))
              fi
            fi
          done
          echo "Respaldos diarios: ${total} antes, ${borrados} borrados (más viejos que ${limite})."
          echo "- Rotación: ${borrados} respaldo(s) de más de ${RETENCION_DIAS} días borrados; quedan $((total - borrados))." >> "$GITHUB_STEP_SUMMARY"
      - name: Cerrar el cortafuegos de Azure SQL (siempre)
        if: always()
        run: |
          az sql server firewall-rule delete --resource-group "$GRUPO" --server "$SERVIDOR" --name "respaldo-${GITHUB_RUN_ID}" --yes \
            || { echo "::error::No se pudo borrar la regla respaldo-${GITHUB_RUN_ID}: la IP de esta máquina sigue autorizada. Bórrela a mano en Azure YA."; exit 1; }
