<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="description" content="Letreros Herrera: letreros, letras corpóreas, rotulación de vehículos y gráfica en Los Ángeles, Región del Biobío. Revisa si estamos abiertos y pide tu cotización." />
    <meta name="theme-color" content="#FFFFFF" />
    <!-- Todo se sirve desde el propio sitio: fuentes, íconos e imágenes. Ningún tercero recibe peticiones
         sin una acción del visitante. En producción la API envía además sus propias cabeceras (fase 16).
         Fase 14B: ingreso con Google. Se agregan SOLO las rutas que Google documenta para su botón (script, marco, conexión y
         estilos de accounts.google.com/gsi/); el script no está en el HTML: se carga al pulsar «Continuar con Google».
         En producción (fase 16) el servidor NO debe enviar «Cross-Origin-Opener-Policy: same-origin»: bloquearía la ventana de Google. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; font-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org; frame-src https://www.google.com https://accounts.google.com/gsi/; worker-src 'self' blob:; connect-src 'self' ws://localhost:* http://localhost:* https://localhost:* https://accounts.google.com/gsi/; base-uri 'self'; form-action 'self'; object-src 'none'" />
    <link rel="icon" type="image/png" sizes="32x32" href="/marca/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/marca/icono-192.png" />
    <link rel="apple-touch-icon" href="/marca/apple-touch-icon.png" />
    <!-- Fase 15B (RNFP27): las fuentes se piden junto con el JavaScript, no después del primer dibujo. Si llegaban tarde, el texto cambiaba de
         ancho al aplicarse la fuente y los botones de la portada pasaban de una fila a dos en el teléfono (desplazamiento de diseño). -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-400-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-600-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-700-normal.woff2" />
    <title>Letreros Herrera · SyncTime</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
