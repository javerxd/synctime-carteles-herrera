# Fase 16A: cabeceras de seguridad del sitio. Se incluyen en cada «location» que escribe cabeceras propias, porque nginx
# no hereda add_header de un nivel a otro cuando el nivel interior define alguno.
# Mantener igual a frontend/synctimefront/vercel.json: una prueba (fase16aContenedores.test.js) lo comprueba.
#
# NO se envia «Cross-Origin-Opener-Policy: same-origin»: bloquearia la ventana de «Continuar con Google».
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; font-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org; frame-src https://www.google.com https://accounts.google.com/gsi/; worker-src 'self' blob:; connect-src 'self' https://accounts.google.com/gsi/; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), geolocation=(), microphone=(), payment=(), usb=()" always;
